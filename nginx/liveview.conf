# Konfigurasi Nginx untuk LiveView CCTV Dashboard
# Lokasi: /etc/nginx/sites-available/liveview.conf
# Aktifkan dengan: ln -s /etc/nginx/sites-available/liveview.conf /etc/nginx/sites-enabled/

upstream liveview_backend {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name cctv.lan;  # ganti dengan hostname/IP server di jaringan lokal

    client_max_body_size 10m;

    # ---- Frontend (React build hasil `npm run build`) ----
    root /var/www/liveview/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://liveview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Socket.IO (status kamera realtime) ----
    location /socket.io/ {
        proxy_pass http://liveview_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ---- MediaMTX WebRTC (WHEP) ----
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- MediaMTX Low-Latency HLS (fallback) ----
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # ---- HLS output dari FFmpeg (legacy) ----
    # File ditulis oleh backend ke HLS_OUTPUT_DIR, disajikan langsung oleh Nginx (bukan Node)
    # supaya streaming banyak kamera sekaligus tetap ringan untuk CPU backend.
    location /streams/ {
        alias /var/www/liveview/streams/;

        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;

        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
            types { application/vnd.apple.mpegurl m3u8; }
        }

        location ~* \.ts$ {
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin * always;
            types { video/mp2t ts; }
        }
    }

    access_log /var/log/nginx/liveview.access.log;
    error_log  /var/log/nginx/liveview.error.log;
}
